<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Denis497</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #07090d;
      --bg-mid: #10151f;
      --text: #e8edf5;
      --muted: #9aa6b8;
      --blue: #1d6fff;
      --blue-bright: #3b82ff;
      --line: rgba(232, 237, 245, 0.08);
      --spot-x: 50%;
      --spot-y: 40%;
      --chicken-look-x: 0px;
      --chicken-look-y: 0px;
      --chicken-tilt: 0deg;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Sora", sans-serif;
      color: var(--text);
      background: var(--bg-deep);
      overflow-x: hidden;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 2rem 7.5rem;
      isolation: isolate;
      background:
        radial-gradient(ellipse 80% 60% at 15% 20%, rgba(29, 111, 255, 0.1), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 75%, rgba(56, 120, 255, 0.08), transparent 50%),
        linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #0b1018 100%);
    }

    .cursor-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(
        460px circle at var(--spot-x) var(--spot-y),
        rgba(255, 90, 170, 0.38),
        rgba(90, 170, 255, 0.18) 26%,
        rgba(120, 255, 190, 0.1) 42%,
        transparent 60%
      );
      animation: glow-blink 0.95s ease-in-out infinite, glow-hue 3.2s linear infinite;
    }

    .chicken {
      position: absolute;
      left: 50%;
      bottom: 0.6rem;
      z-index: 2;
      width: 148px;
      height: 148px;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
    }

    .chicken-body {
      width: 100%;
      height: 100%;
      transform-origin: 50% 70%;
      transform: rotate(var(--chicken-tilt));
      transition: transform 0.12s ease-out;
      overflow: visible;
    }

    .chicken-eye-pupil {
      transition: transform 0.08s linear;
      transform: translate(var(--chicken-look-x), var(--chicken-look-y));
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 20%, transparent 75%);
      animation: grid-drift 18s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 44rem;
      width: 100%;
      text-align: center;
      animation: rise 0.9s ease-out both;
    }

    .name {
      font-family: "Outfit", sans-serif;
      font-weight: 700;
      font-size: clamp(2.8rem, 10vw, 5.5rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 1rem;
      background: linear-gradient(120deg, #f4f7fb 20%, #93c5fd 70%, #3b82ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: name-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .tagline {
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
      animation: rise 1s ease-out 0.15s both;
    }

    .variants {
      margin-top: 1.75rem;
      animation: rise 1s ease-out 0.3s both;
    }

    .variants-title {
      font-family: "Outfit", sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    .variants-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .variant-card {
      appearance: none;
      border: 1px solid rgba(232, 237, 245, 0.12);
      background: rgba(16, 21, 31, 0.72);
      color: var(--text);
      border-radius: 0.85rem;
      padding: 1rem 0.7rem;
      font-family: "Outfit", sans-serif;
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .variant-card:hover {
      transform: translateY(-3px);
      border-color: rgba(59, 130, 255, 0.55);
      background: rgba(29, 111, 255, 0.16);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .variant-card:focus-visible {
      outline: 2px solid var(--blue-bright);
      outline-offset: 3px;
    }

    .variant-card.is-active,
    .variant-card.is-winner {
      border-color: rgba(59, 130, 255, 0.8);
      background: rgba(29, 111, 255, 0.24);
      box-shadow: 0 0 0 1px rgba(59, 130, 255, 0.25);
    }

    .variant-card.is-picking {
      border-color: rgba(59, 130, 255, 0.55);
      background: rgba(29, 111, 255, 0.18);
    }

    .variant-card.is-blink {
      animation: winner-blink 0.45s ease-in-out 5;
    }

    .cta {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 1rem 1.85rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(59, 130, 255, 0.75);
      background: linear-gradient(180deg, var(--blue-bright) 0%, var(--blue) 100%);
      color: #fff;
      cursor: pointer;
      font-family: "Outfit", sans-serif;
      font-weight: 600;
      font-size: clamp(0.95rem, 2.4vw, 1.05rem);
      letter-spacing: 0.01em;
      box-shadow:
        0 0 18px rgba(59, 130, 255, 0.45),
        0 0 42px rgba(29, 111, 255, 0.28);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      animation: rise 1s ease-out 0.22s both;
    }

    .cta:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow:
        0 0 24px rgba(59, 130, 255, 0.6),
        0 0 56px rgba(29, 111, 255, 0.38);
    }

    .cta:disabled {
      cursor: wait;
      opacity: 0.85;
    }

    .cta:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 3px;
    }

    .cta svg {
      width: 1.05rem;
      height: 1.05rem;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .cta:hover:not(:disabled) svg {
      transform: translateX(3px);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes name-in {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.98);
        filter: blur(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes grid-drift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 64px 64px, 64px 64px; }
    }

    @keyframes winner-blink {
      0%, 100% {
        opacity: 1;
        box-shadow:
          0 0 0 1px rgba(59, 130, 255, 0.35),
          0 0 22px rgba(59, 130, 255, 0.45);
      }
      50% {
        opacity: 0.35;
        box-shadow:
          0 0 0 1px rgba(59, 130, 255, 0.1),
          0 0 8px rgba(59, 130, 255, 0.15);
      }
    }

    @keyframes glow-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.22; }
    }

    @keyframes glow-hue {
      0% { filter: hue-rotate(0deg) saturate(1.35); }
      100% { filter: hue-rotate(360deg) saturate(1.35); }
    }

    @media (max-width: 640px) {
      .variants-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="cursor-glow" aria-hidden="true"></div>
    <div class="content">
      <h1 class="name">Denis497</h1>
      <p class="tagline">Изучаю вайбкодинг</p>

      <button type="button" class="cta" id="roll-btn">
        Порвут ли туз Паше?
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <section class="variants" aria-label="Варианты">
        <h2 class="variants-title">Варианты</h2>
        <div class="variants-grid">
          <button type="button" class="variant-card">Конечно да</button>
          <button type="button" class="variant-card">Да</button>
          <button type="button" class="variant-card">Хз</button>
        </div>
      </section>
    </div>

    <div class="chicken" id="chicken" aria-hidden="true">
      <svg class="chicken-body" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff8fb8" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#ff8fb8" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe9a8"/>
            <stop offset="100%" stop-color="#f5c15d"/>
          </linearGradient>
        </defs>

        <!-- body -->
        <ellipse cx="70" cy="96" rx="34" ry="26" fill="#fff6e8"/>
        <!-- head -->
        <ellipse cx="70" cy="58" rx="36" ry="34" fill="#fffaf2"/>
        <!-- soft blush -->
        <circle cx="42" cy="72" r="10" fill="url(#cheek)"/>
        <circle cx="98" cy="72" r="10" fill="url(#cheek)"/>
        <!-- comb -->
        <path d="M70 18c2-12 14-16 18-14-2 10-6 16-12 20" fill="#ff4d6d"/>
        <path d="M70 18c-2-12-14-16-18-14 2 10 6 16 12 20" fill="#ff2d55"/>
        <circle cx="70" cy="24" r="7" fill="#ff4d6d"/>
        <!-- wings -->
        <path d="M40 88c-16-6-26-22-30-36 14 8 24 20 30 34z" fill="url(#wingGrad)"/>
        <path d="M100 88c16-6 26-22 30-36-14 8-24 20-30 34z" fill="url(#wingGrad)"/>

        <!-- huge anime eyes -->
        <ellipse cx="52" cy="56" rx="16" ry="20" fill="#1a1a2e" stroke="#111" stroke-width="1.5"/>
        <ellipse cx="88" cy="56" rx="16" ry="20" fill="#1a1a2e" stroke="#111" stroke-width="1.5"/>
        <!-- iris -->
        <circle class="chicken-eye-pupil" cx="52" cy="58" r="9" fill="#5b8cff"/>
        <circle class="chicken-eye-pupil" cx="88" cy="58" r="9" fill="#5b8cff"/>
        <!-- pupil -->
        <circle class="chicken-eye-pupil" cx="52" cy="59" r="4.2" fill="#0b1020"/>
        <circle class="chicken-eye-pupil" cx="88" cy="59" r="4.2" fill="#0b1020"/>
        <!-- shine -->
        <circle class="chicken-eye-pupil" cx="47" cy="50" r="4.5" fill="#fff" opacity="0.95"/>
        <circle class="chicken-eye-pupil" cx="83" cy="50" r="4.5" fill="#fff" opacity="0.95"/>
        <circle class="chicken-eye-pupil" cx="57" cy="63" r="2" fill="#fff" opacity="0.7"/>
        <circle class="chicken-eye-pupil" cx="93" cy="63" r="2" fill="#fff" opacity="0.7"/>

        <!-- cute beak -->
        <path d="M64 74c2 8 10 8 12 0-4 2-8 2-12 0z" fill="#ff9f43"/>
        <path d="M66 74c2 4 6 4 8 0" stroke="#ff7a18" stroke-width="1.2" fill="none"/>
        <!-- tiny smile lines -->
        <path d="M38 68c4 4 8 4 12 0" stroke="#ff8fb8" stroke-width="1.4" fill="none" opacity="0.55"/>
        <path d="M90 68c4 4 8 4 12 0" stroke="#ff8fb8" stroke-width="1.4" fill="none" opacity="0.55"/>

        <!-- legs -->
        <path d="M58 118 L54 132" stroke="#ff9f43" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M82 118 L86 132" stroke="#ff9f43" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M48 132 h14" stroke="#ff9f43" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M78 132 h14" stroke="#ff9f43" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const chicken = document.getElementById("chicken");
    const rollBtn = document.getElementById("roll-btn");
    const cards = [...document.querySelectorAll(".variant-card")];
    let rolling = false;

    scene.addEventListener("pointermove", (event) => {
      const rect = scene.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;
      scene.style.setProperty("--spot-x", `${x}%`);
      scene.style.setProperty("--spot-y", `${y}%`);

      const chickenRect = chicken.getBoundingClientRect();
      const originX = chickenRect.left + chickenRect.width / 2;
      const originY = chickenRect.top + chickenRect.height * 0.4;
      const dx = event.clientX - originX;
      const dy = event.clientY - originY;
      const maxLook = 5.5;
      const distance = Math.hypot(dx, dy) || 1;
      const lookX = (dx / distance) * Math.min(maxLook, distance / 35);
      const lookY = (dy / distance) * Math.min(maxLook, distance / 35);
      const tilt = Math.max(-16, Math.min(16, dx / 24));

      scene.style.setProperty("--chicken-look-x", `${lookX}px`);
      scene.style.setProperty("--chicken-look-y", `${lookY}px`);
      scene.style.setProperty("--chicken-tilt", `${tilt}deg`);
    });

    function clearCardState() {
      cards.forEach((card) => {
        card.classList.remove("is-active", "is-winner", "is-blink", "is-picking");
      });
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    rollBtn.addEventListener("click", async () => {
      if (rolling) return;
      rolling = true;
      rollBtn.disabled = true;
      clearCardState();

      const winnerIndex = Math.floor(Math.random() * cards.length);
      let current = 0;

      for (let i = 0; i < 12; i += 1) {
        cards.forEach((card) => card.classList.remove("is-picking"));
        cards[current].classList.add("is-picking");
        current = (current + 1) % cards.length;
        await sleep(70 + i * 18);
      }

      clearCardState();
      const winner = cards[winnerIndex];
      winner.classList.add("is-winner", "is-blink");

      await sleep(2300);
      winner.classList.remove("is-blink");
      rolling = false;
      rollBtn.disabled = false;
    });
  </script>
</body>
</html>
